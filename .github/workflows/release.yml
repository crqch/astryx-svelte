name: Release

# Publishing is tag-driven: every package in this workspace carries the version
# of the upstream Astryx release it ports, and they move together, so one tag
# names the whole release. `check:publish --version` re-asserts that below
# rather than trusting it — a tag and a manifest that disagree is the one thing
# no other gate in this repo can see.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to dry-run, e.g. 0.3.0. Never publishes.'
        required: true

permissions:
  contents: read
  # Required for npm provenance. Without it `--provenance` fails at publish
  # time, which is after the gates below have already passed.
  id-token: write

jobs:
  # The browser suite is the release's long pole: 305 files in 26 isolated
  # chunks, and one chunked process takes ~26 minutes. Shard it exactly as CI
  # does, so the publish job waits on four ~8-minute runners instead.
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install the browser the client test project needs
        run: bun run --filter @astryx-sv/core test:browser-install

      - name: Build packages
        run: bun run build:packages

      - name: Client test project
        run: bun run --filter @astryx-sv/core test:client
        env:
          CLIENT_CHUNK_SHARD: ${{ matrix.shard }}
          CLIENT_CHUNK_SHARDS: '4'

  publish:
    needs: client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Writes an .npmrc at NPM_CONFIG_USERCONFIG. Bun 1.3.14 ignores that
          # variable and reads only `$HOME/.npmrc` / the project `.npmrc`, so
          # the next step writes the resolved secret to both.
          #
          # NPM_TOKEN must be an **Automation** token (classic) or a **Granular
          # Access Token** with write access to the @astryx-sv scope. A
          # classic *Publish* token does not work on an account with 2FA
          # enforced for writes: the publish authenticates, uploads the tarball,
          # signs the provenance statement, and only then fails with `EOTP —
          # This operation requires a one-time password`. Nothing is published
          # when that happens, but it fails at the last possible step, after the
          # full gate has run.
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is empty; cannot publish." >&2
            exit 1
          fi
          for npmrc in "$HOME/.npmrc" ".npmrc"; do
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc"
            printf 'registry=https://registry.npmjs.org/\n' >> "$npmrc"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve the version being released
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # Deliberately a full install — no --prod, no NODE_ENV=production. Both
      # fidelity oracles read the upstream Astryx packages, which are
      # devDependencies; pruning them turns the checks into no-ops that still
      # report green.
      - run: bun install --frozen-lockfile

      # The same gates as CI, re-run here rather than trusted from the commit's
      # own run: a tag can be pushed at any commit, including one CI never saw.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run --filter '*' check

      - name: Lint
        run: bun run --filter '*' lint

      # Client tests run in the sharded `client` job above. Everything else
      # still runs here, including core's node suite and both oracles.
      - name: Test, fidelity oracles and non-browser suites
        run: |
          bun run --filter @astryx-sv/core test:node
          bun run --filter @astryx-sv/cli test
          bun run --filter '@astryx-sv/theme-*' test
          bun run --filter docs test

      # Manifests, entry points and READMEs, over the built tree. Also asserts
      # every publishable package is at the version this tag names.
      - name: Verify every package is fit to publish
        run: bun scripts/check-publish.mjs --version "${{ steps.version.outputs.value }}"

      # `scripts/publish.mjs` walks the workspace and runs `bun publish` in
      # each public package, because Bun has no recursive publish. Bun rewrites
      # `workspace:^` to a real range at pack time; publishing the manifests
      # with a tool that does not would ship the protocol literally.
      #
      # **No `--provenance`, because this repository is private.** npm signs the
      # statement and publishes it to the Sigstore transparency log first, then
      # the registry rejects the upload:
      #
      #   npm error 422 Unprocessable Entity … Error verifying sigstore
      #   provenance bundle: Unsupported GitHub Actions source repository
      #   visibility: "private". Only public source repositories are supported
      #   when publishing with provenance.
      #
      # Nothing publishes when that happens, but it fails at the last step of a
      # 20-minute job. Provenance is an attestation *about* the build, not a
      # condition of publishing, so it comes out rather than blocking the
      # release. **Restore `--provenance` and `NPM_CONFIG_PROVENANCE: 'true'`
      # if this repository is ever made public** — the `id-token: write`
      # permission above is already in place for it.
      - name: Publish to npm
        if: steps.version.outputs.dry_run == 'false'
        run: bun scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (dry run)
        if: steps.version.outputs.dry_run == 'true'
        run: bun scripts/publish.mjs --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
